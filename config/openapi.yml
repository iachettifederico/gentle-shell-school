# OpenAPI description of the agent-facing API, served at /api/openapi.json.
# `servers` is filled in at request time with the serving origin.
openapi: 3.1.0
info:
  title: Gentle Shell School API
  version: 1.0.0
  description: >-
    Public API for teaching course lessons and recording anonymous student
    progress. No authentication required.
paths:
  /api/enroll:
    post:
      operationId: enroll
      summary: Create an anonymous student and empty progress record.
      responses:
        "201":
          description: The new student ID and progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/InvalidJson"
  /api/progress/{student_id}:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      operationId: getProgress
      summary: Get a student's progress.
      responses:
        "200":
          description: The student's progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/InvalidStudentId"
        "404":
          $ref: "#/components/responses/StudentNotFound"
    put:
      operationId: completeLesson
      summary: Mark a lesson complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteLesson"
      responses:
        "200":
          description: Updated progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          description: Invalid student ID, JSON, lesson slug, or lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/StudentNotFound"
    delete:
      operationId: undoLessonCompletion
      summary: Mark one lesson incomplete or reset all completions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoProgress"
      responses:
        "200":
          description: Updated progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          description: Invalid student ID, JSON, lesson slug, or lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/StudentNotFound"
  /api/instructions/{student_id}:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      operationId: getInstructions
      summary: Get student-specific plain-text agent instructions.
      responses:
        "200":
          description: Student ID and a pointer to llms.txt.
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidStudentId"
        "404":
          $ref: "#/components/responses/StudentNotFound"
  /api/lessons:
    get:
      operationId: listLessons
      summary: List all lessons, sorted by order.
      responses:
        "200":
          description: Every lesson in the course.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
  /api/lessons/{slug}:
    get:
      operationId: getLesson
      summary: Get one lesson by slug.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: welcome
      responses:
        "200":
          description: The lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: No lesson has this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z]+-[a-z]+-\d{4}$'
      example: curious-hacker-2019
  responses:
    InvalidJson:
      description: The request body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidStudentId:
      description: The student ID is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StudentNotFound:
      description: No student has this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Enrollment:
      type: object
      required: [studentId, progress]
      properties:
        studentId:
          type: string
          pattern: '^[a-z]+-[a-z]+-\d{4}$'
        progress:
          $ref: "#/components/schemas/Progress"
    Progress:
      type: object
      required: [completedLessons, createdAt, updatedAt]
      properties:
        completedLessons:
          type: array
          items:
            $ref: "#/components/schemas/Completion"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Completion:
      type: object
      required: [slug, completedAt, source]
      properties:
        slug:
          type: string
        completedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [agent, browser]
        model:
          type: string
    CompleteLesson:
      type: object
      required: [lessonSlug]
      properties:
        lessonSlug:
          type: string
        source:
          type: string
          enum: [agent, browser]
          default: browser
        model:
          type: string
    UndoProgress:
      type: object
      properties:
        lessonSlug:
          type: string
        reset:
          type: boolean
          description: Must be true when used instead of lessonSlug.
    Lesson:
      type: object
      required: [order, slug, title, description, agentInstructions, content]
      properties:
        order:
          type: integer
          description: Position of the lesson in the course, starting at 1.
        slug:
          type: string
          example: welcome
        title:
          type: string
        description:
          type: string
        agentInstructions:
          type: string
          description: >-
            What the agent must teach and verify before the lesson counts as
            complete. Quiz lessons include the shared quiz instructions.
        content:
          type: string
          description: Lesson body as Markdown.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Student not found
