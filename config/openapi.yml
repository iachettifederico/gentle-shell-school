# OpenAPI description of the agent-facing API, served at /api/openapi.json.
# `servers` is filled in at request time with the serving origin.
openapi: 3.1.0
info:
  title: Gentle Shell School API
  version: 1.0.0
  description: >-
    Public API for teaching course lessons and recording anonymous student
    progress. No authentication required. Feedback goes to
    https://github.com/%{feedback_repository}/issues.
paths:
  /api/enroll:
    post:
      operationId: enroll
      summary: Create an anonymous student and empty progress record.
      responses:
        "201":
          description: The new student ID and progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/InvalidJson"
  /api/progress/{student_id}:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      operationId: getProgress
      summary: Get a student's progress.
      responses:
        "200":
          description: The student's progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/InvalidStudentId"
        "404":
          $ref: "#/components/responses/StudentNotFound"
    put:
      operationId: completeLesson
      summary: Mark a lesson complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteLesson"
      responses:
        "200":
          description: Updated progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          description: Invalid student ID, JSON, lesson slug, or lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/StudentNotFound"
    delete:
      operationId: undoLessonCompletion
      summary: Mark one lesson incomplete or reset all completions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoProgress"
      responses:
        "200":
          description: Updated progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          description: Invalid student ID, JSON, lesson slug, or lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/StudentNotFound"
  /api/instructions/{student_id}:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      operationId: getInstructions
      summary: Get student-specific plain-text agent instructions.
      responses:
        "200":
          description: Student ID and a pointer to llms.txt.
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidStudentId"
        "404":
          $ref: "#/components/responses/StudentNotFound"
  /api/labs:
    get:
      parameters:
        - $ref: "#/components/parameters/Locale"
      operationId: listLabs
      summary: List lab summaries.
      responses:
        "200":
          description: Every lab.
          content:
            application/json:
              schema:
                type: object
                required: [labs]
                properties:
                  labs:
                    type: array
                    items:
                      $ref: "#/components/schemas/LabSummary"
  /api/labs/{slug}:
    get:
      operationId: getLab
      summary: Get one lab with its starter files.
      parameters:
        - $ref: "#/components/parameters/Locale"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The lab.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lab"
        "404":
          description: No lab has this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/lessons:
    get:
      parameters:
        - $ref: "#/components/parameters/Locale"
      operationId: listLessons
      summary: List all lessons, sorted by order.
      responses:
        "200":
          description: Every lesson in the course.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
  /api/lessons/{slug}:
    get:
      operationId: getLesson
      summary: Get one lesson by slug.
      parameters:
        - $ref: "#/components/parameters/Locale"
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: welcome
      responses:
        "200":
          description: The lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: No lesson has this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    Locale:
      name: locale
      in: query
      required: false
      schema:
        type: string
        enum: [en, es, es-AR]
      description: Requested content locale; each item reports the locale actually served after fallback.
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z]+-[a-z]+-\d{4}$'
      example: curious-hacker-2019
  responses:
    InvalidJson:
      description: The request body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidStudentId:
      description: The student ID is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StudentNotFound:
      description: No student has this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Enrollment:
      type: object
      required: [studentId, progress]
      properties:
        studentId:
          type: string
          pattern: '^[a-z]+-[a-z]+-\d{4}$'
        progress:
          $ref: "#/components/schemas/Progress"
    Progress:
      type: object
      required: [completedLessons, createdAt, updatedAt]
      properties:
        completedLessons:
          type: array
          items:
            $ref: "#/components/schemas/Completion"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Completion:
      type: object
      required: [slug, completedAt, source]
      properties:
        slug:
          type: string
        completedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [agent, browser]
        model:
          type: string
        evidence:
          $ref: "#/components/schemas/Evidence"
    CompleteLesson:
      type: object
      required: [lessonSlug]
      properties:
        lessonSlug:
          type: string
        source:
          type: string
          enum: [agent, browser]
          default: browser
        model:
          type: string
        evidence:
          $ref: "#/components/schemas/Evidence"
    Evidence:
      type: object
      required: [checks, verifiedBy]
      additionalProperties: false
      properties:
        checks:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [command, result, summary]
            additionalProperties: false
            properties:
              command:
                type: string
                minLength: 1
                maxLength: 500
                pattern: '.*\\S.*'
              result:
                type: string
                enum: [pass, fail]
              summary:
                type: string
                minLength: 1
                maxLength: 500
                pattern: '.*\\S.*'
        verifiedBy:
          type: string
          enum: [self, independent-verifier]
    UndoProgress:
      type: object
      properties:
        lessonSlug:
          type: string
        reset:
          type: boolean
          description: Must be true when used instead of lessonSlug.
    LabSummary:
      type: object
      required: [slug, lesson, title, locale]
      properties:
        slug:
          type: string
        lesson:
          type: string
          description: Slug of the lesson containing this lab.
        title:
          type: string
        locale:
          type: string
          enum: [en, es, es-AR]
    Lab:
      allOf:
        - $ref: "#/components/schemas/LabSummary"
        - type: object
          required: [brief, check, rubric, files]
          properties:
            brief:
              type: string
              description: Lab instructions as Markdown.
            check:
              type: string
              description: Shell command to run from the student scratch directory.
            rubric:
              type: array
              items:
                type: string
            files:
              type: array
              items:
                type: object
                required: [path, content]
                properties:
                  path:
                    type: string
                  content:
                    type: string
    Lesson:
      type: object
      required: [order, slug, title, description, agentInstructions, content, lab, locale, url, next]
      properties:
        order:
          type: integer
          description: Position of the lesson in the course, starting at 1.
        slug:
          type: string
          example: welcome
        title:
          type: string
        description:
          type: string
        module:
          type: [string, "null"]
          description: Optional syllabus module containing the lesson.
        lab:
          type: [string, "null"]
          description: Slug of the linked lab, when this lesson has one.
        locale:
          type: string
          enum: [en, es, es-AR]
          description: Locale actually served after per-file fallback.
        agentInstructions:
          type: string
          description: >-
            What the agent must teach and verify before the lesson counts as
            complete. Quiz lessons include the shared quiz instructions.
        content:
          type: string
          description: Lesson body as Markdown.
        url:
          type: string
          format: uri
          description: The lesson page in the requested language.
        next:
          description: >-
            The following lesson, or null after the last one. Give the student
            `prompt` (with {studentId} replaced) and `url` with `?sid=<id>`.
          oneOf:
            - type: "null"
            - type: object
              required: [slug, title, url, prompt]
              properties:
                slug:
                  type: string
                title:
                  type: string
                url:
                  type: string
                  format: uri
                prompt:
                  type: string
                  description: The copyable prompt for the next lesson, containing the {studentId} placeholder.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Student not found
