title: Delegá una exploración
brief: |
  ## Explorá antes de planificar

  Delegá una exploración de solo lectura de `src/`. Guardá su entrega como `handoff.md`.
  Incluí al menos tres referencias con la forma `src/path.js:line` que apunten a
  líneas reales. Así la exploración resulta útil sin copiar el código fuente en la
  entrega.
