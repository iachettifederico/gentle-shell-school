title: Escribí una skill enfocada
brief: |
  ## Codificá un contrato de ejecución reutilizable

  Creá `skills/<name>/SKILL.md`. Dale frontmatter YAML con `name` y una
  `description` que nombre su disparador con la palabra `Trigger:` sin traducir
  (por ejemplo `Trigger: ...`), y después agregá las seis secciones que exige la guía de estilo:
  Activation Contract, Hard Rules, Decision Gates, Execution Steps, Output
  Contract y References. Mantenela enfocada en un flujo de trabajo repetible.
  `node --test` solo comprueba lo que un script puede observar en la skill; la calificación con rúbrica en
  contexto nuevo demuestra que le da a un agente un flujo de trabajo accionable.
