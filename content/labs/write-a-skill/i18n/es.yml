title: Escribe una skill enfocada
brief: |
  ## Codifica un contrato de ejecución reutilizable

  Crea `skills/<name>/SKILL.md`. Dale frontmatter YAML con `name` y
  `description`; después agrega las seis secciones exigidas por la guía de estilo:
  Activation Contract, Hard Rules, Decision Gates, Execution Steps, Output
  Contract y References. Mantenla enfocada en un flujo de trabajo repetible.
